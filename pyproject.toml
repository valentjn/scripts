[project]
name = "scripts"
version = "1.0.0"
description = "Various scripts"
readme = "README.md"
requires-python = ">=3.15.0"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "ruff>=0.15.9",
    "ty>=0.0.29",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "docstring-missing-exception",
    "docstring-missing-returns",
    "docstring-missing-yields",
    "incorrect-blank-line-before-class",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "unspecified-encoding",
]
preview = true
select = ["ALL"]

[tool.ty]
